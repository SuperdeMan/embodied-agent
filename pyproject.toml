[project]
name = "embodied-agent"
version = "0.1.0"
description = "Embodiment-agnostic embodied agent runtime (brain-cerebellum-body layered architecture)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SuperdeMan" }]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.39",
    "numpy>=1.26",
    "aiohttp>=3.11",
    "pillow>=10",
]

[project.scripts]
embodied = "embodied.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]
sim = ["mujoco>=3.2"]
rpc = ["grpcio>=1.66", "grpcio-tools>=1.66"]
# M2 learning loop (docs/decisions.md D014): training-side deps are heavy (torch) and
# NEVER required at runtime — deployment uses the `policy` group (ONNX) only.
# `onnx` rides in learn for export-time metadata stamping (scripts/export_onnx.py).
learn = ["lerobot>=0.4", "onnx>=1.16"]
policy = ["onnxruntime>=1.18"]
# Perception v1 (D015): open-vocabulary detection. The color-blob fallback needs
# nothing; this group only serves GroundingDinoProvider.
perceive = ["transformers>=4.44", "torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embodied"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
